spring:
  application:
    name: course-service
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/course_db}
    username: ${DB_USERNAME:course_user}
    password: ${DB_PASSWORD:course_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

students:
  email-domain: ${STUDENT_EMAIL_DOMAIN:student.etf.org}

course-import:
  max-rows: 5000
  max-columns: 64
  header-scan-rows: 100
  layouts:
    etf:
      sheet-name: st_spisak_studenata_na_predmetu
      metadata-value-offset: 1

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
