spring:
  application:
    name: analytics-service

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info

course-service:
  base-url: ${COURSE_SERVICE_URL:http://localhost:8081}

attendance-analytics:
  low-attendance-threshold-percent: ${ATTENDANCE_THRESHOLD_PERCENT:75}

authentication:
  app-issuer: https://attendance-system.local
  audience: course-service
  jwt-secret: ${APP_JWT_SECRET:local-development-secret-change-me-123456789}
