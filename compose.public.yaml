services:
  frontend:
    build:
      args:
        VITE_API_URL: /course
        VITE_AUTH_URL: /auth
        VITE_ANALYTICS_URL: /analytics
    ports: !override []

  postgres:
    ports: !override
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  analytics-postgres:
    ports: !override
      - "127.0.0.1:${ANALYTICS_POSTGRES_PORT:-5433}:5432"

  config-server:
    ports: !override
      - "127.0.0.1:${CONFIG_SERVER_PORT:-8888}:8888"

  eureka-server:
    ports: !override
      - "127.0.0.1:${EUREKA_PORT:-8761}:8761"

  course-service:
    environment:
      FRONTEND_ORIGIN: ${NGROK_DOMAIN:?Unesi NGROK_DOMAIN u .env}
      FRONTEND_ALLOWED_ORIGINS: ${NGROK_DOMAIN:?Unesi NGROK_DOMAIN u .env}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    ports: !override
      - "127.0.0.1:${COURSE_SERVICE_PORT:-8081}:8081"

  analytics-service:
    environment:
      FRONTEND_ALLOWED_ORIGINS: ${NGROK_DOMAIN:?Unesi NGROK_DOMAIN u .env}
    ports: !override
      - "127.0.0.1:${ANALYTICS_SERVICE_PORT:-8082}:8082"

  auth-service:
    environment:
      FRONTEND_ALLOWED_ORIGINS: ${NGROK_DOMAIN:?Unesi NGROK_DOMAIN u .env}
      TEST_EMPLOYEE_PASSWORD: ${PUBLIC_TEST_EMPLOYEE_PASSWORD:?Unesi PUBLIC_TEST_EMPLOYEE_PASSWORD u .env}
      PUBLIC_DEPLOYMENT: "true"
    ports: !override
      - "127.0.0.1:${AUTH_SERVICE_PORT:-8083}:8083"

  gateway:
    image: nginx:alpine
    volumes:
      - ./nginx-public.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      frontend:
        condition: service_started
      course-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy

  ngrok:
    image: ngrok/ngrok:latest
    command: ["http", "gateway:80", "--url=${NGROK_DOMAIN:?Unesi NGROK_DOMAIN u .env}"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?Unesi NGROK_AUTHTOKEN u .env}
    depends_on:
      gateway:
        condition: service_started
