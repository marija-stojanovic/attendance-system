name: attendance-system

services:
  frontend:
    build: ./frontend
    ports:
      - "5173:80"

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./infra/keycloak:/opt/keycloak/data/import:ro

  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-course_db}
      POSTGRES_USER: ${POSTGRES_USER:-course_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-course_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - course_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-course_user} -d ${POSTGRES_DB:-course_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  course-service:
    build:
      context: ./backend/course-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-course_db}
      DB_USERNAME: ${POSTGRES_USER:-course_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-course_password}
      STUDENT_EMAIL_DOMAIN: ${STUDENT_EMAIL_DOMAIN:-student.etf.org}
      EMPLOYEE_EMAIL_DOMAIN: ${EMPLOYEE_EMAIL_DOMAIN:-etf.org}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8080/realms/attendance-system}
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/attendance-system/protocol/openid-connect/certs
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
    ports:
      - "${COURSE_SERVICE_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  keycloak_data:
  course_postgres_data:
