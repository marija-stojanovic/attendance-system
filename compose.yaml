name: attendance-system

services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        VITE_API_URL: ${FRONTEND_API_URL:-http://localhost:8081}
        VITE_ANALYTICS_URL: ${FRONTEND_ANALYTICS_URL:-http://localhost:8082}
    ports:
      - "5173:80"

  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-course_db}
      POSTGRES_USER: ${POSTGRES_USER:-course_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-course_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - course_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-course_user} -d ${POSTGRES_DB:-course_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  course-service:
    build:
      context: ./backend/course-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-course_db}
      DB_USERNAME: ${POSTGRES_USER:-course_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-course_password}
      STUDENT_EMAIL_DOMAIN: ${STUDENT_EMAIL_DOMAIN:-student.etf.unibl.org}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-local-development-secret-change-me-123456789}
      QR_ROTATION_SECONDS: ${QR_ROTATION_SECONDS:-30}
      SESSION_MAX_ACTIVE_SECONDS: ${SESSION_MAX_ACTIVE_SECONDS:-14400}
      ATTENDANCE_THRESHOLD_PERCENT: ${ATTENDANCE_THRESHOLD_PERCENT:-75}
      TEST_EMPLOYEE_ENABLED: ${TEST_EMPLOYEE_ENABLED:-true}
      TEST_EMPLOYEE_USERNAME: ${TEST_EMPLOYEE_USERNAME:-profesor}
      TEST_EMPLOYEE_PASSWORD: ${TEST_EMPLOYEE_PASSWORD:-Profesor123!}
      TEST_EMPLOYEE_EMAIL: ${TEST_EMPLOYEE_EMAIL:-profesor@etf.unibl.org}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      FRONTEND_ALLOWED_ORIGINS: ${FRONTEND_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "${COURSE_SERVICE_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  analytics-service:
    build:
      context: ./backend/analytics-service
    environment:
      COURSE_SERVICE_URL: http://course-service:8081
      APP_JWT_SECRET: ${APP_JWT_SECRET:-local-development-secret-change-me-123456789}
      ATTENDANCE_THRESHOLD_PERCENT: ${ATTENDANCE_THRESHOLD_PERCENT:-75}
      FRONTEND_ALLOWED_ORIGINS: ${FRONTEND_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "${ANALYTICS_SERVICE_PORT:-8082}:8082"
    depends_on:
      course-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  course_postgres_data:
