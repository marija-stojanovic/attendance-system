name: attendance-system

services:
  config-server:
    build:
      context: ./backend/config-server
    ports:
      - "${CONFIG_SERVER_PORT:-8888}:8888"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:8888/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  eureka-server:
    build:
      context: ./backend/eureka-server
    environment:
      EUREKA_HOSTNAME: eureka-server
      CONFIG_SERVER_URL: http://config-server:8888
    ports:
      - "${EUREKA_PORT:-8761}:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      config-server:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        VITE_API_URL: ${FRONTEND_API_URL:-http://localhost:8081}
        VITE_AUTH_URL: ${FRONTEND_AUTH_URL:-http://localhost:8083}
        VITE_ANALYTICS_URL: ${FRONTEND_ANALYTICS_URL:-http://localhost:8082}
    ports:
      - "5173:80"

  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-course_db}
      POSTGRES_USER: ${POSTGRES_USER:-course_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-course_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - course_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-course_user} -d ${POSTGRES_DB:-course_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  analytics-postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: ${ANALYTICS_POSTGRES_DB:-analytics_db}
      POSTGRES_USER: ${ANALYTICS_POSTGRES_USER:-analytics_user}
      POSTGRES_PASSWORD: ${ANALYTICS_POSTGRES_PASSWORD:-analytics_password}
    ports:
      - "${ANALYTICS_POSTGRES_PORT:-5433}:5432"
    volumes:
      - analytics_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ANALYTICS_POSTGRES_USER:-analytics_user} -d ${ANALYTICS_POSTGRES_DB:-analytics_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  course-service:
    build:
      context: ./backend/course-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-course_db}
      DB_USERNAME: ${POSTGRES_USER:-course_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-course_password}
      STUDENT_EMAIL_DOMAIN: ${STUDENT_EMAIL_DOMAIN:-student.etf.unibl.org}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-local-development-secret-change-me-123456789}
      SESSION_MAX_ACTIVE_SECONDS: ${SESSION_MAX_ACTIVE_SECONDS:-14400}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      FRONTEND_ALLOWED_ORIGINS: ${FRONTEND_ALLOWED_ORIGINS:-http://localhost:5173}
      EUREKA_URL: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-local-internal-service-key-change-me}
    ports:
      - "${COURSE_SERVICE_PORT:-8081}:8081"
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  analytics-service:
    build:
      context: ./backend/analytics-service
    environment:
      DB_URL: jdbc:postgresql://analytics-postgres:5432/${ANALYTICS_POSTGRES_DB:-analytics_db}
      DB_USERNAME: ${ANALYTICS_POSTGRES_USER:-analytics_user}
      DB_PASSWORD: ${ANALYTICS_POSTGRES_PASSWORD:-analytics_password}
      EUREKA_URL: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      APP_JWT_SECRET: ${APP_JWT_SECRET:-local-development-secret-change-me-123456789}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-local-internal-service-key-change-me}
      ATTENDANCE_THRESHOLD_PERCENT: ${ATTENDANCE_THRESHOLD_PERCENT:-75}
      FRONTEND_ALLOWED_ORIGINS: ${FRONTEND_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "${ANALYTICS_SERVICE_PORT:-8082}:8082"
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      analytics-postgres:
        condition: service_healthy
      course-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  auth-service:
    build:
      context: ./backend/auth-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-course_db}
      DB_USERNAME: ${POSTGRES_USER:-course_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-course_password}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-local-development-secret-change-me-123456789}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      STUDENT_EMAIL_DOMAIN: ${STUDENT_EMAIL_DOMAIN:-student.etf.unibl.org}
      TEST_EMPLOYEE_ENABLED: ${TEST_EMPLOYEE_ENABLED:-true}
      TEST_EMPLOYEE_USERNAME: ${TEST_EMPLOYEE_USERNAME:-profesor}
      TEST_EMPLOYEE_PASSWORD: ${TEST_EMPLOYEE_PASSWORD:-Profesor123!}
      TEST_EMPLOYEE_EMAIL: ${TEST_EMPLOYEE_EMAIL:-profesor@etf.unibl.org}
      FRONTEND_ALLOWED_ORIGINS: ${FRONTEND_ALLOWED_ORIGINS:-http://localhost:5173}
      EUREKA_URL: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-local-internal-service-key-change-me}
    ports:
      - "${AUTH_SERVICE_PORT:-8083}:8083"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      course-service:
        condition: service_healthy

volumes:
  course_postgres_data:
  analytics_postgres_data:
