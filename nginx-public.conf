map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

resolver 127.0.0.11 valid=10s ipv6=off;

upstream course_backend {
    zone course_backend 64k;
    server course-service:8081 resolve;
}

upstream auth_backend {
    zone auth_backend 64k;
    server auth-service:8083 resolve;
}

upstream analytics_backend {
    zone analytics_backend 64k;
    server analytics-service:8082 resolve;
}

upstream frontend_backend {
    zone frontend_backend 64k;
    server frontend:80 resolve;
}

server {
    listen 80;
    client_max_body_size 6m;

    location ~ ^/(course|auth|analytics)/(internal|actuator)/ {
        return 404;
    }

    location /course/ {
        proxy_pass http://course_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location /auth/ {
        proxy_pass http://auth_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    }

    location /analytics/ {
        proxy_pass http://analytics_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://frontend_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
